spring.application.name=station1-registration

# REST server (registration of arriving animals)
server.port=8080

# gRPC server (lets the other subsystems read animal details)
spring.grpc.server.port=9091

# Station 1's own database: its own schema in PostgreSQL, please change username/password to your own.
# Point the url at another server/database to give the station a completely separate database.
spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse?currentSchema=station1
spring.datasource.username=postgres
spring.datasource.password=12345678

# runs schema.sql and data.sql on startup (resets the tables every time)
spring.sql.init.mode=always

# station 2 (cutting), registered animals are sent there
stations.cutting.host=localhost
stations.cutting.port=9092
# how long to wait for another station before giving up (and retrying later)
stations.timeout-seconds=3
stations.retry-delay-ms=10000
