spring.application.name=station1-registration

# tests use an in-memory H2 database (in postgres mode) instead of the real one
spring.datasource.url=jdbc:h2:mem:station1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# random port so the tests don't clash with a running server
spring.grpc.server.port=0

# nothing runs here during tests, forwarding just fails and is retried
stations.cutting.host=localhost
stations.cutting.port=1
stations.timeout-seconds=1
stations.retry-delay-ms=600000
