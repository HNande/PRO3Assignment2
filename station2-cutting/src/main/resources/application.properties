spring.application.name=station2-cutting

# gRPC server (cutting parts, receiving animals from station 1, traceability)
spring.grpc.server.port=9092

# Station 2's own database: its own schema in PostgreSQL, please change username/password to your own.
# Point the url at another server/database to give the station a completely separate database.
spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse?currentSchema=station2
spring.datasource.username=postgres
spring.datasource.password=12345678

# runs schema.sql and data.sql on startup (resets the tables every time)
spring.sql.init.mode=always

# maximum weight capacity of a tray
cutting.tray-max-weight-kg=50.0

# station 3 (packing), closed trays are sent there
stations.packing.host=localhost
stations.packing.port=9093
# how long to wait for another station before giving up (and retrying later)
stations.timeout-seconds=3
stations.retry-delay-ms=10000
