spring.application.name=station3-packing

# tests use an in-memory H2 database (in postgres mode) instead of the real one
spring.datasource.url=jdbc:h2:mem:station3;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# random port so the tests don't clash with a running server
spring.grpc.server.port=0

packing.half-animal-parts=HAM,RIBS,LOIN
