spring.application.name=station3-packing

# gRPC server (packing products, receiving trays from station 2, traceability)
spring.grpc.server.port=9093

# Station 3's own database: its own schema in PostgreSQL, please change username/password to your own.
# Point the url at another server/database to give the station a completely separate database.
spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse?currentSchema=station3
spring.datasource.username=postgres
spring.datasource.password=12345678

# runs schema.sql and data.sql on startup (resets the tables every time)
spring.sql.init.mode=always

# the parts that make up "half an animal"
packing.half-animal-parts=HAM,RIBS,LOIN
