spring.application.name=traceability

# gRPC server, used from outside the slaughterhouse (e.g. recalls)
spring.grpc.server.port=9090

# the traceability service has no database of its own, it asks the stations
stations.registration.host=localhost
stations.registration.port=9091
stations.cutting.host=localhost
stations.cutting.port=9092
stations.packing.host=localhost
stations.packing.port=9093
# how long to wait for a station before answering UNAVAILABLE
stations.timeout-seconds=3
